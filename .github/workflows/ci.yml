---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar ferramentas
        run: pip install -r requirements-dev.txt

      - name: Instalar collections
        run: ansible-galaxy collection install -r collections/requirements.yml

      - name: Instalar Gitleaks fixado e verificar checksum
        run: ./scripts/install-gitleaks.sh

      - name: Validar Ansible e estrutura
        run: ./scripts/validate.sh

      - name: Validar configuração na imagem Hermes fixada
        run: |
          mkdir -p /tmp/hermes-runtime-ci
          cp /tmp/hermes-config-ci.yaml /tmp/hermes-runtime-ci/config.yaml
          docker run --rm \
            -e HERMES_HOME=/opt/data \
            -v /tmp/hermes-runtime-ci:/opt/data \
            nousresearch/hermes-agent:v2026.8.31 doctor

      - name: Procurar segredos no histórico
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

  molecule:
    runs-on: ubuntu-latest
    needs: static
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar ferramentas
        run: pip install -r requirements-dev.txt

      - name: Instalar collections
        run: ansible-galaxy collection install -r collections/requirements.yml

      - name: Testar role base no Debian 13
        run: molecule test -s default
