---
- name: Validar sistema operacional suportado
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == "Debian"
      - ansible_facts.distribution_major_version | int >= 12
    fail_msg: "Este projeto suporta Debian 12 ou 13."

- name: Instalar pacotes básicos
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configurar timezone
  ansible.builtin.file:
    src: "/usr/share/zoneinfo/{{ system_timezone }}"
    dest: /etc/localtime
    state: link
    force: true

- name: Registrar timezone
  ansible.builtin.copy:
    content: "{{ system_timezone }}
"
    dest: /etc/timezone
    owner: root
    group: root
    mode: "0644"
