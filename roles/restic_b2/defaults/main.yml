---
restic_enabled: true
restic_initialize_repository: false
restic_bucket: ""
restic_bucket_prefix: hermes
restic_b2_region: us-west-004
restic_backup_paths:
  - "{{ hermes_root }}/home"
  - "{{ hermes_root }}/vault"
  - "{{ hermes_root }}/workspace"
  - "{{ hermes_stack_dir }}"
restic_excludes:
  - "**/.cache/**"
  - "**/__pycache__/**"
  - "**/node_modules/**"
  - "**/.trash/**"
restic_backup_hour: "03"
restic_backup_minute: "17"
restic_keep_daily: 7
restic_keep_weekly: 5
restic_keep_monthly: 12
