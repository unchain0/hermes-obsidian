---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: debian13
    image: debian:13
    pre_build_image: true
    command: sleep infinity
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/roles"
  inventory:
    host_vars:
      debian13:
        ansible_python_interpreter: /usr/bin/python3
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
